name: Build & deploy store

# Rebuilds the catalog (fresh stars, versions, screenshots) and publishes to GitHub Pages:
#   - on every push to main
#   - every day 06:00 UTC = 2 AM Eastern (new themes, Omarchy repo apps, stars, versions)
#   - manually from the Actions tab
on:
  push:
    branches: [main]
  schedule:
    # 06:00 UTC: the full daily refresh (new themes, stars, versions).
    # Every 4 hours: Rabbit Ears' live TV guide is rebuilt hourly on the `data` branch, but it
    # only reaches omarchystore.com when THIS workflow runs, because deploy copies those files
    # into the published site. With a once-a-day deploy the guide users actually saw could be
    # 24 h old, so the app ran out of programme data and kept showing the last thing it knew —
    # "old stuff on repeat". Four-hourly bounds that staleness well inside the guide's window.
    - cron: "0 6 * * *"
    - cron: "40 2,10,14,18,22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: build.py reads each app's first appearance from git to date the
          # New Apps shelf. A shallow clone shows every app as added in one commit, which
          # trips the bulk-import guard and leaves New Apps permanently empty.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add new apps from the official Omarchy package repo
        run: python3 scripts/omarchy_repo.py --write
      - name: ImageMagick (measures how colourful each theme preview is, for Featured themes)
        run: command -v convert >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick)
      - name: Build catalog from live data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py
      - name: Collect plugins (Omarchy Plugin Marketplace)
        run: python3 scripts/plugins.py
      - name: Collect screensavers (marketplace + GitHub)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/screensavers.py
      - name: Pick up SnapDock TV files from the data branch (built hourly by the Refresh TV workflow)
        run: |
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/data/tv.json -o site/tv.json || true
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/data/tv-guide.json -o site/tv-guide.json || true
      - name: Assemble site
        run: |
          mkdir -p _site/desktop-files
          cp -r site/. _site/
          rm -f _site/assets/og-template.svg
          # Files the desktop installer (install.sh) downloads (the plain app shell, no SEO pages):
          cp -r site _site/desktop-files/site
          rm -f _site/desktop-files/site/install.sh _site/desktop-files/site/get.sh
          rm -rf _site/desktop-files/site/icons _site/desktop-files/site/theme-previews
          rm -f _site/desktop-files/site/plugins.json _site/desktop-files/site/screensavers.json _site/desktop-files/site/tv.json _site/desktop-files/site/tv-guide.json
          cp desktop/omarchy-store desktop/uninstall.sh _site/desktop-files/
          # Scripts needed by install.sh (post-update validation hook)
          mkdir -p _site/scripts _site/desktop-files/scripts
          cp scripts/post-update-validation.sh _site/scripts/
          cp scripts/post-update-validation.sh _site/desktop-files/scripts/
          # One real, indexable page per app/category + sitemap.xml + robots.txt
          python3 scripts/seo.py _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
