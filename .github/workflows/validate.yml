name: Validate registry

# Runs on every pull request. Blocks merges that break the catalog format or
# try to sneak arbitrary shell commands into an install recipe.
on:
  pull_request:
    paths: ["registry/**", "scripts/**", "site/**", "desktop/**", ".github/workflows/validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check registry
        run: python3 scripts/build.py --check
      - name: Check packages exist (Arch repos or AUR)
        run: |
          python3 - <<'PY'
          import json, glob, sys, time, urllib.request, urllib.parse

          def lookup(url):
              """Return the results list, or None if the lookup itself failed."""
              for attempt in range(2):
                  try:
                      return json.load(urllib.request.urlopen(url, timeout=10))["results"]
                  except Exception:
                      time.sleep(1 + attempt)
              return None

          missing, unverified = [], []
          consecutive_failures = 0
          for f in sorted(glob.glob("registry/apps/*.json")):
              a = json.load(open(f))
              # Omarchy's own repo isn't searchable from CI; omarchy-installed apps are exempt.
              if a["install"]["method"] in ("omarchy", "store"):
                  continue
              for p in a["detect"]:
                  if p.endswith("-bin"):
                      continue
                  if consecutive_failures >= 5:
                      unverified.append(f"{f}: {p!r} (skipped, package servers unreachable)")
                      continue
                  r = lookup("https://archlinux.org/packages/search/json/?" + urllib.parse.urlencode({"name": p}))
                  if r == []:
                      r = lookup("https://aur.archlinux.org/rpc/v5/info?arg[]=" + urllib.parse.quote(p))
                  if r is None:
                      consecutive_failures += 1
                      unverified.append(f"{f}: could not check {p!r} (lookup failed)")
                  else:
                      consecutive_failures = 0
                      if not r:
                          missing.append(f"{f}: package {p!r} not found in Arch repos or AUR")
                  time.sleep(0.3)

          # Lookup failures are warnings only; just a confirmed 'not found' fails the check.
          for u in unverified:
              print(f"::warning::{u}")
          print("\n".join(missing) or "✓ no confirmed-missing packages")
          sys.exit(1 if missing else 0)
          PY
