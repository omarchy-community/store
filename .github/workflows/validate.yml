name: Validate registry

# Runs on every pull request. Blocks merges that break the catalog format or
# try to sneak arbitrary shell commands into an install recipe.
on:
  pull_request:
    paths: ["registry/**", "scripts/**", "site/**", "desktop/**", ".github/workflows/validate.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed to see which app files this PR changed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check registry
        run: python3 scripts/build.py --check
      - name: Check packages exist (Arch repos, Omarchy repo or AUR)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 -u scripts/check_packages.py
